<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Productivity Loop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main>
        <h1>Personal Productivity Loop</h1>
        <p>Goal title: {{ goal_title }}</p>
        <p>Goal description: {{ goal_description }}</p>
        <p>Goal target date: {{ goal_target_date }}</p>
        <p>Goal status: {{ goal_status }}</p>
        <p><a href="{{ url_for('edit_goal') }}">Edit goal</a></p>
        <p><a href="{{ url_for('new_entry') }}">Log today</a></p>

        <section aria-label="Last 90 days heatmap">
            <h2>Last 90 Days</h2>
            <div class="heatmap" role="img" aria-label="Engagement heatmap for recent days">
                {% for column in heatmap_columns %}
                <div class="heatmap-column">
                    {% for day in column %}
                    <div
                        class="heatmap-cell intensity-{{ day.engagement }}{% if not day.in_last_90 %} heatmap-cell-outside{% endif %}{% if day.is_today %} heatmap-cell-today{% endif %}"
                        data-date="{{ day.date }}"
                        data-engagement="{{ day.engagement }}"
                        title="{{ day.date }} (engagement: {{ day.engagement }})"
                    ></div>
                    {% endfor %}
                </div>
                {% endfor %}
            </div>
        </section>
    </main>
</body>
</html>
